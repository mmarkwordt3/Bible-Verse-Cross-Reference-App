name: Build English review assistance
on: workflow_dispatch
permissions: {contents: write, actions: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npm run reviews:assistance:refresh
      - run: npm run reviews:assistance:audit
      - run: npm run lint && npm run typecheck && npm test
      - name: Commit controlled assistance files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/sources/brenton-source.json data/normalized/brenton-verses.json public/data/greek-reuse/review-assistance.json reports/greek-review-assistance-coverage.json
          git diff --cached --quiet || git commit -m "data: refresh Brenton review assistance"
          git push
      - name: Trigger normal Pages deployment
        run: gh workflow run deploy-pages.yml --ref main
        env: {GH_TOKEN: '${{ github.token }}'}
